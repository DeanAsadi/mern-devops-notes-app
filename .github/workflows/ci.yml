name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  BACKEND_IMAGE: dockerdeen26/mern-notes-backend
  FRONTEND_IMAGE: dockerdeen26/mern-notes-frontend

jobs:
  validate:
    name: Validate application build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build backend Docker image
        run: docker build -t notes-backend:test ./backend

      - name: Build frontend Docker image
        run: docker build -t notes-frontend:test ./frontend

      - name: Validate Docker Compose config
        run: docker compose config

  push-images:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub using github-actions-mern-notes token
        uses: docker/login-action@v3
        with:
          username: dockerdeen26
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker image metadata for backend
        id: backend_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Generate Docker image metadata for frontend
        id: frontend_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.backend_meta.outputs.tags }}
          labels: ${{ steps.backend_meta.outputs.labels }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.frontend_meta.outputs.tags }}
          labels: ${{ steps.frontend_meta.outputs.labels }}
  validate-kubernetes:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Validate Kubernetes YAML client-side
        run: |
          kubectl apply --dry-run=client -f k8s/namespace.yaml
          kubectl apply --dry-run=client -f k8s/backend-configmap.yaml
          kubectl apply --dry-run=client -f k8s/backend-secret.yaml
          kubectl apply --dry-run=client -f k8s/mongodb-deployment.yaml
          kubectl apply --dry-run=client -f k8s/mongodb-service.yaml
          kubectl apply --dry-run=client -f k8s/backend-deployment.yaml
          kubectl apply --dry-run=client -f k8s/backend-service.yaml
          kubectl apply --dry-run=client -f k8s/frontend-deployment.yaml
          kubectl apply --dry-run=client -f k8s/frontend-service.yaml
          kubectl apply --dry-run=client -f k8s/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mern-notes-ingress
  namespace: mern-notes
spec:
  ingressClassName: nginx
  rules:
    - host: mern-notes.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
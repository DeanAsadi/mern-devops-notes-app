apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: mern-notes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: DOCKERDEEN26/mern-notes-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80